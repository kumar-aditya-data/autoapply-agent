[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoapply"
version = "0.1.0"
description = "Human-in-the-loop job application assistant: JD parsing, CV matching, grounded drafting and fabrication review with LangGraph + Claude. Never submits applications."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=1.5",
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.0",
    "pydantic>=2.6",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
data = ["kaggle>=1.6"]

[project.scripts]
autoapply = "autoapply.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
